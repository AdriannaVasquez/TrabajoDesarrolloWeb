<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow">
                <div class="card-body p-5">
                    <h1 class="h3 text-center fw-bold mb-3">Iniciar sesión</h1>
                    <div class="text-center mb-3">
                        <a href="#" class="text-decoration-none h6 text-primary">Registrarme</a>
                    </div>
                    <p class="text-muted text-center mb-4">Ingresa tu correo para continuar</p>    
                    <form>
                        <div class="mb-3">
                            <label class="form-label text-muted">Correo electrónico</label>
                            <input type="email" class="form-control" placeholder="ejemplo@correo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ingresa tu contraseña</label>
                            <input type="password" class="form-control" placeholder="••••••••">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox">
                                <label class="form-check-label fw-bold">Recuerdame</label>
                            </div>
                        </div>
                        <div class="mb-4">
                            <a href="#" class="text-decoration-none fw-bold">¿Olvidaste tu contraseña?</a>
                        </div>
                        
                        <hr>
                        <button class="btn btn-dark w-100 fw-bold py-2">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
