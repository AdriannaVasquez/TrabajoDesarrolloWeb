<div class="login-body">
    <div class="container">
        <ul class="nav nav-pills nav-justified mb-3" role="tablist">
            <li class="nav-item" role="presentation">
                <a class="nav-link active" routerLink="/login">Iniciar Sesión</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" routerLink="/registro">Registrarme</a>
            </li>
        </ul>

        <!-- Contenido Login -->
        <form (submit)="onSubmit($event)">
            <div class="form-group">
                <strong>Ingresa tu correo para continuar</strong>
                <input 
                    type="email" 
                    [(ngModel)]="email"
                    name="email" 
                    required 
                    placeholder="Correo electrónico"
                    [disabled]="isLoading">
            </div>
            
            <div class="form-group">
                <strong>Ingresa tu contraseña</strong>
                <input 
                    type="password" 
                    [(ngModel)]="password"
                    name="password" 
                    required 
                    placeholder="Contraseña"
                    [disabled]="isLoading">
            </div>
            
            <div class="options-group">
                <div class="checkbox-group">
                    <input 
                        type="checkbox" 
                        [(ngModel)]="rememberMe"
                        name="rememberMe"
                        [disabled]="isLoading">
                    <label>Recuérdame</label>
                </div>
                
                <div class="forgot-password">
                    <a href="#" (click)="onForgotPassword($event)">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
            
            <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="isLoading">
                {{ isLoading ? 'Cargando...' : 'Ingresar' }}
            </button>
        </form>
        
        <div 
            *ngIf="message" 
            [class]="'message ' + messageType">
            {{ message }}
        </div>
    </div>
</div>
