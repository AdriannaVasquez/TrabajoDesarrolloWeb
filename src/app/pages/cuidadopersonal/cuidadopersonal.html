<div class="container-fluid my-4">
  <div class="row">
    
    <!-- Sidebar de filtros -->
    <div class="col-md-3">
      <button class="btn btn-outline-primary w-100 mb-3" (click)="borrarFiltros()">
        Borrar Filtros
      </button>

      <div class="accordion" id="filtros">
        <!-- Marca -->
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#filtroMarca">
              Marca ({{marcas.length}})
            </button>
          </h2>
          <div id="filtroMarca" class="accordion-collapse collapse" data-bs-parent="#filtros">
            <div class="accordion-body">
              <div *ngFor="let marca of marcas" class="mb-2">
                <input 
                  type="radio" 
                  name="marca" 
                  [value]="marca"
                  [checked]="marcaSeleccionada === marca"
                  (change)="marcaSeleccionada = marca; aplicarFiltros()">
                {{ marca }}
              </div>
              <div *ngIf="marcas.length === 0" class="text-muted small">
                No hay marcas disponibles
              </div>
            </div>
          </div>
        </div>

        <!-- Rango de precio -->
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#filtroPrecio">
              Rango de precio
            </button>
          </h2>
          <div id="filtroPrecio" class="accordion-collapse collapse" data-bs-parent="#filtros">
            <div class="accordion-body">
              <div>
                <input 
                  type="radio" 
                  name="precio" 
                  value="20-50"
                  [checked]="rangoPrecioSeleccionado === '20-50'"
                  (change)="rangoPrecioSeleccionado = '20-50'; aplicarFiltros()">
                20 - 50 
              </div>
              <div>
                <input 
                  type="radio" 
                  name="precio" 
                  value="51-100"
                  [checked]="rangoPrecioSeleccionado === '51-100'"
                  (change)="rangoPrecioSeleccionado = '51-100'; aplicarFiltros()">
                51 - 100 
              </div>
              <div>
                <input 
                  type="radio" 
                  name="precio" 
                  value="101-150"
                  [checked]="rangoPrecioSeleccionado === '101-150'"
                  (change)="rangoPrecioSeleccionado = '101-150'; aplicarFiltros()">
                101 - 150 
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Productos -->
    <div class="col-md-9">
      <div *ngIf="cargando" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <div class="row">
        <div class="col-xl-3 col-lg-4 col-md-6 mb-4" *ngFor="let producto of productosFiltrados">
          <div class="card h-100 shadow-lg producto-card">
            <div class="d-flex justify-content-center align-items-center bg-white producto-img-container">
              <img [src]="producto.ruta" 
                   class="img-fluid producto-img" 
                   [alt]="producto.nombre"
                   onerror="this.src='https://via.placeholder.com/150'">
            </div>      
            <div class="card-body text-center text-dark d-flex flex-column">
              <div class="bg-warning text-dark small mb-3 d-inline-block px-3 py-1 rounded-pill">
                {{ producto.presentacion }}
              </div>
              <h6 class="card-title fw-bold mb-3">
                {{ producto.nombre }}
              </h6>              
              <div class="mt-auto">
                <div class="mb-3">
                  <span class="fw-bold d-block precio">
                    S/.{{ producto.precio.toFixed(2) }}
                  </span>
                </div>  
               <button class="btn agregar-btn w-100" (click)="agregarAlCarrito(producto)">
                Agregar
              </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="!cargando && productosFiltrados.length === 0" class="text-center">
        <p class="text-muted">No se encontraron productos con los filtros aplicados.</p>
      </div>
    </div>
  </div>
</div>
