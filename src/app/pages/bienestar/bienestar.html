  <div class="container-fluid my-4">
    <div class="row">
      
      <!-- Sidebar de filtros -->
      <div class="col-md-3">
        <button class="btn btn-outline-primary w-100 mb-3">Borrar Filtros</button>
        <div class="accordion" id="filtros">

          <!-- Marca -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#filtroEdad">
                Marca
              </button>
            </h2>
            <div id="filtroEdad" class="accordion-collapse collapse" data-bs-parent="#filtros">
              <div class="accordion-body">
                <div><input type="checkbox"> Huggies </div>
                <div><input type="checkbox"> Bayer </div>
                <div><input type="checkbox"> Panadol</div>
              </div>
            </div>
          </div>

          <!-- Categoría -->
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#filtroCondicion">
                Categoría
              </button>
            </h2>
            <div id="filtroCondicion" class="accordion-collapse collapse" data-bs-parent="#filtros">
              <div class="accordion-body">
                <div><input type="checkbox"> Multivitamínicos</div>
                <div><input type="checkbox"> Gripe, tos y congestión </div>
                <div><input type="checkbox"> Cuidado dermatológico</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Productos -->
      <div class="col-md-9">
        <div class="row">
          <div class="col-xl-3 col-lg-4 col-md-6 mb-4" *ngFor="let producto of productosCategoria3">
            <div class="card h-100 shadow-lg producto-card">
              <div class="d-flex justify-content-center align-items-center bg-white producto-img-container">
                <img [src]="producto.ruta" 
                     class="img-fluid producto-img" 
                     [alt]="producto.nombre">
              </div>      
              <div class="card-body text-center text-dark d-flex flex-column">
                <div class="bg-warning text-dark small mb-3 d-inline-block px-3 py-1 rounded-pill">
                  {{ producto.presentacion }}
                </div>
                <h6 class="card-title fw-bold mb-3">
                  {{ producto.nombre }}
                </h6>
                
                <div class="mt-auto">
                  <div class="mb-3">
                    <span class="fw-bold d-block precio">
                      S/.{{ producto.precio.toFixed(2) }}
                    </span>
                  </div>  
                  <button class="btn agregar-btn w-100">
                    Agregar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
