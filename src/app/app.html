<!-- Banner de oferta -->
<div class="container">
    <div class="banner">
    <h1>10% DE DESCUENTO. En tu primera compra por la Web</h1>
  </div>
  
  <nav class="navbar navbar-expand-lg bg-purple navbar-dark">
    <div class="container-fluid">
      
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/inicio">
        <img src="assets/logo2.png" alt="logo" width="200" height="45">
      </a>

        <!-- Barra de búsqueda -->
      <div class="collapse navbar-collapse" id="navbarContent">
        <form class="d-flex mx-auto my-2 my-lg-0">
          <div class="input-group">
            <input
              autocomplete="off"
              type="search"
              class="form-control rounded"
              placeholder="Busca tu marcas y productos favoritos"
              style="min-width: 350px;"/>
            <button class="btn btn-outline-light" type="submit">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </form>
        
        <!-- Icono de inicio de sesión y carrito -->
        <div class="d-flex align-items-center">
          @if (isLoggedIn) {
            <div class="dropdown me-3">
              <button class="btn btn-outline-light dropdown-toggle d-flex align-items-center" 
                      type="button" 
                      data-bs-toggle="dropdown"
                      style="color: #E91D62; border-color: #E91D62;">
                <i class="bi bi-person me-2"></i>
                <span>{{ userEmail || 'Mi Cuenta' }}</span>
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" routerLink="/carrito">
                  <i class="bi bi-cart3 me-2"></i>Mi Carrito
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                </a></li>
              </ul>
            </div>
          } @else {
            <a class="nav-link me-3" style="color: #E91D62" routerLink="/login">
              <div class="d-flex align-items-center">
                <i class="bi bi-person me-2"></i>
                <span>Iniciar sesión</span>
              </div>
            </a>
          }
          
          <!-- Icono del carrito -->
          <a class="nav-link position-relative" routerLink="/carrito">
            <i class="bi bi-cart3 fs-5" style="color: #E91D62;"></i>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Filtro de categoría -->
<div class="row justify-content-center">
  <div class="container my-3">
    <ul class="nav justify-content-center rounded-pill shadow-sm p-2 border" style="background-color: white;">
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center text-dark" href="/promociones">
          <i class="bi bi-percent me-2"></i> Ofertas
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center text-dark active" href="/cuidadopersonal">
          <i class="bi bi-person-standing me-2"></i> Cuidado Personal
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center text-dark" href="/bienestar">
          <i class="bi bi-heart-fill me-2"></i> Bienestar
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center text-dark" href="/mamabebe">
          <i class="bi bi-people-fill me-2"></i> Mamá y bebé
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link d-flex align-items-center text-dark" href="/vitaminas">
          <i class="bi bi-capsule-pill me-2"></i> Vitaminas
        </a>
      </li>
    </ul>
  </div>
 
  <div>
    <router-outlet></router-outlet>
  </div>
